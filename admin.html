<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | ObourCS Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=2">
    <link rel="stylesheet" href="admin.css">
    
    <!-- PWA Setup & Favicon -->
    <link rel="icon" type="image/png" href="icon-512.png">
    <meta name="theme-color" content="#0a0b10">
</head>

<body>
    <!-- Background Animated Shapes -->
    <div class="background-elements">
        <div class="blob shape-1"></div>
        <div class="blob shape-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="logo">
            <span class="en-logo">ObourCS</span> Hub Admin
        </div>
        <div class="nav-links">
            <a href="index.html">العودة للموقع</a>
            <a href="#" id="logout-btn" style="display: none; color: #ff5f56;">تسجيل خروج</a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="section-padding" id="login-section">
        <div class="admin-card glass-card mockup-card">
            <div class="mockup-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="section-header" style="margin-bottom: 2rem;">
                <h2 class="section-title">تسجيل <span class="gradient-text">الدخول</span></h2>
                <p class="section-subtitle">هذه الصفحة مخصصة لمديري الموقع فقط.</p>
            </div>
            <form id="login-form" class="admin-form">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="admin@obour.edu.eg">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">تسجيل الدخول</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </section>

    <!-- Dashboard Section (Hidden by default) -->
    <section class="section-padding" id="dashboard-section" style="display: none;">
        <div class="admin-card glass-card">
            <div class="section-header" style="margin-bottom: 2rem;">
                <h2 class="section-title">إضافة <span class="gradient-text">محتوى جديد</span></h2>
                <p class="section-subtitle">قم بتعبئة البيانات أدناه لإضافة ملفات جديدة للموقع فوراً.</p>
            </div>
            
            <form id="add-content-form" class="admin-form">
                <div class="grid-2-cols">
                    <div class="input-group">
                        <label>الفرقة الدراسية</label>
                        <select id="level" required>
                            <option value="" disabled selected>اختر الفرقة</option>
                            <option value="level1">الفرقة الأولى</option>
                            <option value="level2">الفرقة الثانية</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>الترم الدراسي</label>
                        <select id="term" required>
                            <option value="" disabled selected>اختر الترم</option>
                            <option value="term1">الترم الأول</option>
                            <option value="term2">الترم الثاني</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>المادة الدراسية</label>
                    <select id="subject" required disabled>
                        <option value="" disabled selected>برجاء اختيار الفرقة والترم أولاً</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>نوع المحتوى</label>
                    <select id="category" required>
                        <option value="" disabled selected>اختر النوع</option>
                        <option value="summaries">ملخصات ومحاضرات</option>
                        <option value="exams">امتحانات وتدريبات</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>عنوان الملف (مثل: ملخص ميدتيرم)</label>
                    <input type="text" id="title" required placeholder="اكتب اسم الملف هنا...">
                </div>

                <div class="input-group">
                    <label>رابط جوجل درايف</label>
                    <input type="url" id="link" required placeholder="https://drive.google.com/...">
                </div>

                <button type="submit" class="btn btn-secondary w-100 mt-3" id="submit-btn">رفع وإضافة للموقع</button>
                <div id="add-success" class="success-msg"></div>
                <div id="add-error" class="error-msg"></div>
            </form>
        </div>
    </section>

    <!-- Firebase Scripts will go here later -->
    <script src="admin.js"></script>
</body>
</html>
