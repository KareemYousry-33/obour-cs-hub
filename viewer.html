<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح الملفات | ObourCS Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=2">
    <link rel="icon" type="image/png" href="icon-512.png?v=2">
    <style>
        .file-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .file-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 2rem;
            background: rgba(20, 22, 30, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
        }

        .file-card:hover {
            transform: translateX(-10px);
            background: rgba(40, 44, 60, 0.6);
            border-color: rgba(76, 201, 240, 0.4);
            box-shadow: 0 10px 25px rgba(76, 201, 240, 0.15);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex: 1;
            min-width: 0;
        }

        .file-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }

        .file-icon svg {
            width: 24px;
            height: 24px;
        }

        .file-details {
            min-width: 0;
        }

        .file-details h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        .file-actions {
            display: flex;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .action-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            background: transparent;
            color: var(--text-main);
        }

        .view-btn {
            border: 1px solid rgba(76, 201, 240, 0.3);
        }
        
        .view-btn:hover {
            background: rgba(76, 201, 240, 0.15);
            border-color: rgba(76, 201, 240, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.2);
            color: var(--secondary);
        }

        .download-btn {
            border: 1px solid rgba(247, 37, 133, 0.3);
        }
        
        .download-btn:hover {
            background: rgba(247, 37, 133, 0.15);
            border-color: rgba(247, 37, 133, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.2);
            color: var(--accent);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link:hover {
            color: var(--text-main);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(20, 22, 30, 0.4);
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }
        
        .empty-state svg {
            color: var(--text-muted);
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .loading-spinner {
            display: block;
            margin: 4rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .file-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
            }
            .file-actions {
                width: 100%;
                justify-content: space-between;
            }
            .action-btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="background-elements">
        <div class="blob shape-1"></div>
        <div class="blob shape-2"></div>
    </div>

    <nav class="glass-nav">
        <div class="logo" dir="ltr">
            <a href="javascript:history.back()" style="text-decoration: none; color: inherit; display: flex; gap: 0.5rem; align-items: center;">
                <span class="en-logo">ObourCS</span>
                <span class="ar-logo">Hub</span>
            </a>
        </div>
    </nav>

    <main class="section-padding">
        <div style="max-width: 800px; margin: 0 auto;">
            <a onclick="history.back()" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                الرجوع
            </a>

            <div class="section-header" style="text-align: right; margin-bottom: 3rem;">
                <h2 class="section-title" style="font-size: 2.2rem;" id="page-title">جاري التحميل...</h2>
                <p class="section-subtitle" style="margin: 0;" id="page-subtitle"></p>
            </div>

            <div id="loading" class="loading-spinner"></div>
            
            <div id="file-list" class="file-list" style="display: none;">
                <!-- Files will be dynamically added here -->
            </div>
            
            <div id="empty-state" class="empty-state" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
                <h3>قريباً!</h3>
                <p style="color: var(--text-muted);">لم يتم رفع أي ملفات في هذا القسم حتى الآن.</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="viewer.js"></script>
</body>

</html>
